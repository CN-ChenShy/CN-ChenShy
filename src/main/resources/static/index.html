<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>主题帖</title>
  <style>
    body {
      max-width: 800px;
      margin: 40px auto;
      font-family: "Microsoft YaHei", Arial, sans-serif;
      padding: 0 20px;
    }
    h1 {
      font-size: 36px;
      margin-bottom: 30px;
    }
    /* 登录区域 */
    .login-area {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 15px;
      border: 1px solid #eee;
      border-radius: 8px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .login-area label {
      font-size: 18px;
      white-space: nowrap;
    }
    .login-area input {
      padding: 8px 10px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 4px;
      flex: 1;
      min-width: 120px;
    }
    .login-area button {
      padding: 8px 16px;
      font-size: 16px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      background: #f0f0f0;
    }
    .login-area button:hover {
      background: #e0e0e0;
    }
    .status-text {
      font-size: 18px;
      margin-left: 10px;
    }
    .logout-btn {
      background: #ff4d4f;
      color: white;
    }
    .logout-btn:hover {
      background: #d9363e;
    }
    /* 管理台按钮 */
    .admin-btn {
      background: #d32f2f;
      color: white;
      padding: 10px 18px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      margin-bottom: 20px;
      display: none;
      font-size: 16px;
    }
    .admin-btn:hover {
      background: #b71c1c;
    }
    /* 帖子列表 */
    .post {
      border: 1px solid #eee;
      padding: 18px;
      margin: 12px 0;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .post:hover {
      background: #f8f8f8;
    }
    .title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 6px;
    }
    .time {
      color: #666;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <h1>主题帖</h1>

  <!-- 登录/注册区域 -->
  <div class="login-area">
    <label>用户名：</label>
    <input id="username" placeholder="请输入用户名">
    <label>密码：</label>
    <input id="password" type="password" placeholder="请输入密码">
    <button onclick="login()">登录</button>
    <button onclick="register()">注册</button>
    <span id="tip" class="status-text"></span>
    <button id="logoutBtn" class="logout-btn" style="display:none;" onclick="logout()">退出登录</button>
  </div>

  <!-- 管理台按钮（仅管理员可见） -->
  <button class="admin-btn" id="adminBtn" onclick="location.href='admin.html'">
    管理台（发帖）
  </button>

  <!-- 帖子列表 -->
  <div id="postList"></div>

  <script>
    const base = "http://localhost:8080";
    let loginUser = localStorage.getItem("loginUser");

    // 页面加载时初始化状态
    checkLoginStatus();
    loadPosts();

    // 加载帖子列表
    async function loadPosts() {
      let res = await fetch(base + "/post/list");
      let posts = await res.json();
      let list = document.getElementById("postList");
      list.innerHTML = "";
      posts.forEach(p => {
        list.innerHTML += `
          <div class="post" onclick="goDetail(${p.id})">
            <div class="title">${p.title}</div>
            <div class="time">${p.createTime}</div>
          </div>
        `;
      });
    }

    // 检查登录状态，更新UI
    function checkLoginStatus() {
      loginUser = localStorage.getItem("loginUser");
      if (loginUser) {
        document.getElementById("tip").innerText = `已登录：${loginUser}`;
        document.getElementById("logoutBtn").style.display = "inline-block";
        // 管理员显示管理台按钮
        if (loginUser === "admin") {
          document.getElementById("adminBtn").style.display = "block";
        }
      } else {
        document.getElementById("tip").innerText = "";
        document.getElementById("logoutBtn").style.display = "none";
        document.getElementById("adminBtn").style.display = "none";
      }
    }

    // 登录
    async function login() {
      let username = document.getElementById("username").value.trim();
      let password = document.getElementById("password").value.trim();

      if (!username || !password) {
        alert("用户名和密码不能为空！");
        return;
      }

      let res = await fetch(base + "/user/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, password })
      });
      let msg = await res.text();
      if (msg === "登录成功") {
        localStorage.setItem("loginUser", username);
        checkLoginStatus();
        alert("登录成功！");
        // 清空输入框
        document.getElementById("username").value = "";
        document.getElementById("password").value = "";
      } else {
        alert(msg);
      }
    }

    // 注册
    async function register() {
      let username = document.getElementById("username").value.trim();
      let password = document.getElementById("password").value.trim();

      if (!username || !password) {
        alert("用户名和密码不能为空！");
        return;
      }

      let res = await fetch(base + "/user/register", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, password })
      });
      let msg = await res.text();
      alert(msg);
    }

    // 退出登录
    function logout() {
      localStorage.removeItem("loginUser");
      checkLoginStatus();
      alert("已退出登录");
    }

    // 跳转到帖子详情
    function goDetail(id) {
      location.href = `detail.html?id=${id}`;
    }
  </script>
</body>
</html>
