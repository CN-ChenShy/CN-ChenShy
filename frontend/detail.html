<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
<title>帖子详情</title>
  <style>
    body {
      max-width: 800px;
      margin: 40px auto;
      font-family: "Microsoft YaHei", Arial, sans-serif;
      padding: 0 20px;
    }
    .back-btn {
      font-size: 16px;
      padding: 8px 16px;
      background: #1677ff;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      margin-bottom: 20px;
    }
    .back-btn:hover {
      background: #0d63d0;
    }
    .post-card {
      border: 1px solid #eee;
      border-radius: 8px;
      padding: 25px;
      margin-bottom: 30px;
    }
    .post-title {
      font-size: 28px;
      font-weight: bold;
      color: #222;
      margin-bottom: 20px;
      padding-bottom: 15px;
      border-bottom: 1px solid #eee;
    }
    .post-content {
      font-size: 18px;
      line-height: 1.8;
      color: #444;
    }
    h3 {
      font-size: 22px;
      margin-bottom: 15px;
    }

    /* 修复：评论样式 */
    .comment {
      border-left: 3px solid #ccc;
      padding: 10px 15px;
      margin: 10px 0;
      background: #f9f9f9;
      border-radius: 0 4px 4px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .comment strong {
      color: #1677ff;
    }
    .comment-content {
      flex: 1;
      word-break: break-all;
    }

    /* 修复！按钮不再拉伸！ */
    .comment-del-btn {
      background: #ff4444;
      color: #fff;
      border: none;
      border-radius: 3px;
      padding: 5px 10px;
      font-size: 12px;
      cursor: pointer;
      width: auto !important;
      flex: 0 0 auto;
    }
    .comment-del-btn:hover {
      background: #cc0000;
    }

    .input-box {
      margin: 20px 0;
    }
    textarea, button {
      padding: 10px;
      width: 100%;
      box-sizing: border-box;
      margin-top: 5px;
      border-radius: 4px;
    }
    textarea {
      border: 1px solid #ccc;
      font-size: 16px;
    }
    button {
      background: #1677ff;
      color: white;
      border: none;
      cursor: pointer;
      font-size: 16px;
    }
    button:hover {
      background: #0d63d0;
    }

    /* 新加：评论右侧时间样式 */
    .comment-time {
      font-size: 12px;
      color: #999;
      margin-left: 12px;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <button class="back-btn" onclick="location.href='index.html'">← 返回首页</button>

  <div class="post-card">
    <div class="post-title" id="title"></div>
    <div class="post-content" id="content"></div>
  </div>

  <h3>评论区</h3>
  <div id="commentList"></div>

  <div class="input-box">
    <textarea id="commentContent" rows="3" placeholder="写下你的评论..."></textarea>
    <button onclick="sendComment()">发表评论</button>
  </div>

  <script>
    const base = "/api"
    let user = localStorage.getItem("loginUser");

    let postId = new URLSearchParams(location.search).get("id");
    if (!postId || postId === "null") {
      alert("请从首页点击帖子进入！");
      location.href = "index.html";
    }

    async function loadDetail() {
      let res = await fetch(base + "/post/" + postId);
      let post = await res.json();
      document.getElementById("title").innerText = post.title;
      document.getElementById("content").innerText = post.content;
    }

    async function loadComments() {
      let res = await fetch(base + "/comment/list/" + postId);
      let list = await res.json();
      let commentList = document.getElementById("commentList");
      commentList.innerHTML = "";
      let loginUser = localStorage.getItem("loginUser");

      list.forEach(c => {
        commentList.innerHTML += `
          <div class="comment">
            <div class="comment-content">
              <strong>${c.username}</strong>：${c.content}
            </div>

            <div style="display: flex; align-items: center; gap: 8px;">
              ${loginUser === 'admin' ? `<button class="comment-del-btn" onclick="deleteComment(event, ${c.id})">删除</button>` : ''}
              <span class="comment-time">${c.createTime}</span>
            </div>
          </div>
        `;
      });
    }

    async function deleteComment(e, commentId) {
      e.stopPropagation();
      if (!confirm("确定删除这条评论？")) return;

      let loginUser = localStorage.getItem("loginUser");
      let res = await fetch(`${base}/comment/delete/${commentId}?username=${loginUser}`, {
        method: "DELETE"
      });
      if (res.ok) {
        let msg = await res.text();
        alert(msg);
      } else {
        let err = await res.json();
        alert(err.msg);
      }
      loadComments();
    }

    async function sendComment() {
      user = localStorage.getItem("loginUser");
      if (!user) {
        alert("请先登录");
        return;
      }

      let content = document.getElementById("commentContent").value.trim();
      if (!content) {
        alert("评论内容不能为空！");
        return;
      }

      await fetch(base + "/comment/add", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ postId: postId, username: user, content: content })
      });
      loadComments();
      document.getElementById("commentContent").value = "";
    }

    loadDetail();
    loadComments();
  </script>
</body>
</html>
