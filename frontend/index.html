<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  
  <link rel="icon" href="icon/favicon.ico" sizes="any">
  <link rel="icon" href="icon/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon/apple-touch-icon.png">
  <link rel="manifest" href="icon/site.webmanifest">

  <title>Quectel comment section™</title>
  <style>
    body {
      max-width: 800px;
      margin: 40px auto;
      font-family: "Microsoft YaHei", Arial, sans-serif;
      padding: 0 20px;
    }
    h1 {
      font-size: 36px;
      margin-bottom: 30px;
    }
    .login-area {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 15px;
      border: 1px solid #eee;
      border-radius: 8px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .login-area label {
      font-size: 18px;
      white-space: nowrap;
    }
    .login-area input {
      padding: 8px 10px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 4px;
      flex: 1;
      min-width: 120px;
    }
    .login-area button {
      padding: 8px 16px;
      font-size: 16px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      background: #f0f0f0;
    }
    .login-area button:hover {
      background: #e0e0e0;
    }
    .status-text {
      font-size: 18px;
      margin-left: 10px;
    }
    .logout-btn {
      background: #ff4d4f;
      color: white;
    }
    .logout-btn:hover {
      background: #d9363e;
    }
    .admin-btn {
      background: #d32f2f;
      color: white;
      padding: 10px 18px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      margin-bottom: 20px;
      display: none;
      font-size: 16px;
    }
    .admin-btn:hover {
      background: #b71c1c;
    }
    .post {
      border: 1px solid #eee;
      padding: 18px;
      margin: 12px 0;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
      position: relative;
    }
    .post:hover {
      background: #f8f8f8;
    }
    .title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 6px;
    }
    .time {
      color: #666;
      font-size: 14px;
    }
    .delete-btn {
      position: absolute;
      top: 12px;
      right: 12px;
      background: #ff4444;
      color: white;
      border: none;
      border-radius: 4px;
      padding: 4px 8px;
      font-size: 12px;
      cursor: pointer;
    }
    .delete-btn:hover {
      background: #cc0000;
    }
  </style>
</head>
<body>
  <h1>主题帖</h1>

  <form class="login-area" onsubmit="return false;">
    <label>用户名：</label>
    <input id="username" placeholder="请输入用户名">
    <label>密码：</label>
    <input id="password" type="password" placeholder="请输入密码">
    <button type="button" onclick="login()">登录</button>
    <button type="button" onclick="register()">注册</button>
    <span id="tip" class="status-text"></span>
    <button id="logoutBtn" class="logout-btn" style="display:none;" onclick="logout()">退出登录</button>
  </form>

  <button class="admin-btn" id="adminBtn" onclick="location.href='admin.html'">
    管理台（发帖）
  </button>

  <div id="postList"></div>

  <script>
    const base = "/api"
    let loginUser = localStorage.getItem("loginUser");

    checkLoginStatus();
    loadPosts();

    // 加载帖子-只带 token
    async function loadPosts() {
      let token = localStorage.getItem("token");
      let headers = {};

      if (token) {
        headers = {
          "token": token
        };
      }

      let res = await fetch(base + "/post/list", { headers });

      if (res.status === 401) {
        alert("你的账号已在另一处登录，请重新登录");
        logout();
        return;
      }

      let posts = await res.json();
      let list = document.getElementById("postList");
      list.innerHTML = "";

      if (!posts || !posts.length) return;

      posts.forEach(p => {
        list.innerHTML += `
          <div class="post" onclick="goDetail(${p.id})">
            <div class="title">${p.title}</div>
            <div class="time">${p.createTime}</div>
            ${loginUser === 'admin' ? `<button class="delete-btn" onclick="deletePost(event, ${p.id})">删除帖子</button>` : ''}
          </div>`;
      });
    }

    // 删除帖子-只传 token，不传 username！
    async function deletePost(e, postId) {
      e.stopPropagation();
      if (!confirm("确定要删除这个帖子吗？")) return;

      let token = localStorage.getItem("token");

      let res = await fetch(`${base}/post/delete/${postId}`, {
        method: "DELETE",
        headers: {
          "token": token
        }
      });

      if (res.status === 401) {
        alert("你的账号已在另一处登录，请重新登录");
        logout();
        return;
      }

      if (res.ok) {
        let msg = await res.text();
        alert(msg);
      } else {
        let errData = await res.json();
        alert(errData.msg);
      }
      loadPosts();
    }

    function checkLoginStatus() {
      loginUser = localStorage.getItem("loginUser");
      let token = localStorage.getItem("token");
      
      if (loginUser && token) {
        document.getElementById("tip").innerText = `已登录：${loginUser}`;
        document.getElementById("logoutBtn").style.display = "inline-block";
        if (loginUser === "admin") {
          document.getElementById("adminBtn").style.display = "block";
        }
      } else {
        document.getElementById("tip").innerText = "未登录，可浏览";
        document.getElementById("logoutBtn").style.display = "none";
        document.getElementById("adminBtn").style.display = "none";
      }
    }

    // 登录
    async function login() {
      let username = document.getElementById("username").value.trim();
      let password = document.getElementById("password").value.trim();
      if (!username || !password) { alert("不能为空"); return; }

      let res = await fetch(base + "/user/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, password })
      });
      let token = await res.text();
      
      if (token !== "登录失败") {
        localStorage.setItem("loginUser", username);
        localStorage.setItem("token", token);
        checkLoginStatus();
        alert("登录成功！");
        document.getElementById("username").value = "";
        document.getElementById("password").value = "";
        loadPosts();
      } else {
        alert("登录失败");
      }
    }

    // 注册
    async function register() {
      let username = document.getElementById("username").value.trim();
      let password = document.getElementById("password").value.trim();
      if (!username || !password) { alert("不能为空"); return; }
      let res = await fetch(base + "/user/register", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, password })
      });
      let msg = await res.text();
      alert(msg);
    }

    function logout() {
      localStorage.removeItem("loginUser");
      localStorage.removeItem("token");
      checkLoginStatus();
      alert("已退出登录");
      loadPosts();
    }

    function goDetail(id) {
      location.href = `detail.html?id=${id}`;
    }
  </script>
</body>
</html>
