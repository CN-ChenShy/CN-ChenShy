<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
<title>管理台 - 发布帖子</title>
  <style>
    body {
      max-width: 800px;
      margin: 40px auto;
      font-family: "Microsoft YaHei", Arial, sans-serif;
      padding: 0 20px;
    }

    .back-btn {
      font-size: 16px;
      padding: 8px 16px;
      background: #1677ff;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      margin-bottom: 20px;
    }
    .back-btn:hover {
      background: #0d63d0;
    }

    h2 {
      font-size: 26px;
      margin-bottom: 25px;
      color: #333;
    }

    .form-item {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 8px;
      color: #444;
    }

    input, textarea {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
      font-family: inherit;
    }

    textarea {
      min-height: 180px;
      resize: vertical;
    }

    .submit-btn {
      width: 100%;
      padding: 12px;
      font-size: 18px;
      background: #1677ff;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    .submit-btn:hover {
      background: #0d63d0;
    }
  </style>
</head>
<body>

  <button class="back-btn" onclick="location.href='index.html'">← 返回首页</button>

  <h2>📝 管理台 - 发布帖子</h2>

  <div class="form-item">
    <label>帖子标题</label>
    <input id="title" placeholder="请输入帖子标题">
  </div>

  <div class="form-item">
    <label>帖子内容</label>
    <textarea id="content" placeholder="请输入帖子内容"></textarea>
  </div>

  <button class="submit-btn" onclick="sendPost()">发布帖子</button>

  <script>
    const base = "/api"
    
    // ✅ 修复：只传 token，不传 username，解决中文报错
    function getHeaders() {
      let token = localStorage.getItem("token");
      if (!token) return {};
      return {
        "Content-Type": "application/json",
        "token": token
      };
    }

    // 处理 401 顶号
    async function handle401(res) {
      if (res.status === 401) {
        alert("你的账号已在另一处登录，请重新登录");
        localStorage.removeItem("loginUser");
        localStorage.removeItem("token");
        location.href = "index.html";
        return true;
      }
      return false;
    }

    async function sendPost() {
      let title = document.getElementById("title").value.trim();
      let content = document.getElementById("content").value.trim();
      let loginUser = localStorage.getItem("loginUser");

      if (!title || !content) {
        alert("标题和内容不能为空！");
        return;
      }
      if (!loginUser) {
        alert("请先登录");
        return;
      }

      try {
        let res = await fetch(base + "/post/add", {
          method: "POST",
          headers: getHeaders(),
          body: JSON.stringify({
            title: title,
            content: content,
            username: loginUser
          })
        });

        if (await handle401(res)) return;

        if (res.ok) {
          let txt = await res.text();
          alert(txt);
          location.href = "index.html";
        } else {
          let errText = await res.text();
          try {
            let data = JSON.parse(errText);
            alert(data.msg || errText);
          } catch (e) {
            alert(errText);
          }
        }

      } catch (err) {
        alert("发布失败：网络或服务器错误");
      }
    }
  </script>
</body>
</html>
