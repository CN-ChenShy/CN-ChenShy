services:
  backend:
    build: .
    container_name: comment-backend
    restart: always
    environment:
      TZ: Asia/Shanghai
      JAVA_OPTS: -Duser.timezone=Asia/Shanghai
      # 这里填MySQL所在的设备IP
      SPRING_DATASOURCE_URL: jdbc:mysql://10.202.102.1:3306/commentapp?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    container_name: comment-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./frontend:/usr/share/nginx/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network: