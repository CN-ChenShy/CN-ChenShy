server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # 前端页面
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 接口转发给后端
    location /api/ {
        proxy_pass http://app:8080/;
        proxy_set_header Host $host;
    }
}